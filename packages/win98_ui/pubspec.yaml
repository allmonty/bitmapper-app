name: win98_ui
description: "A Windows 98 look-and-feel widget kit for Flutter: bevels, buttons, windows, menus, tabs, sliders, dialogs and more. Depends only on flutter/widgets."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.1
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: PixelifySans
      fonts:
        - asset: fonts/PixelifySans.ttf
