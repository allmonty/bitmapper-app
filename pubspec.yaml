name: bitmapper
description: "Bitmapper: retro pixel-art photo filter with a Windows 98 look."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bitmapper_core:
    path: packages/bitmapper_core
  win98_ui:
    path: packages/win98_ui
  video_frames:
    path: packages/video_frames
  flutter_file_dialog: ^3.0.0
  image: ^4.5.4
  image_picker: ^1.2.1
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.3.1
  receive_sharing_intent: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true

# App icon for Android and iOS. Regenerate after replacing the image:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android 8+ masks icons into a circle/squircle: inset the logo on a white
  # background (the logo's own) so the sparkles near the edges aren't cut.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 16
