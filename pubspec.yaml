name: bitmapper
description: "Bitmapper: retro pixel-art photo filter with a Windows 98 look."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bitmapper_core:
    path: packages/bitmapper_core
  win98_ui:
    path: packages/win98_ui
  flutter_file_dialog: ^3.0.0
  image: ^4.5.4
  image_picker: ^1.2.1
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0

flutter:
  generate: true
